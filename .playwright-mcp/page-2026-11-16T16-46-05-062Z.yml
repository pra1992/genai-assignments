            - paragraph [ref=f2e327]: Uses an implicit wait of 20 s – acceptable for a quick demo but can cause unnecessary delays when the element is found early. No reuse of WebDriver/Actions objects; the single‑use nature is fine for a tiny script but not optimal for a larger suite. No redundant loops or heavy computations – the code is lightweight.
