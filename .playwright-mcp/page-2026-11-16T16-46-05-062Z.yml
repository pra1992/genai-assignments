            - paragraph [ref=f2e340]: No try‑catch or try‑with‑resources; any WebDriver exception (e.g., NoSuchElementException, TimeoutException) will abort the JVM without a clear message. No cleanup (driver.quit()) in a finally block – browsers may stay open on failure. No logging or reporting of failures.
