            - paragraph [ref=f2e366]: Directly instantiating ChromeDriver without driver‑binary management (e.g., WebDriverManager) can cause version mismatches on different machines. Missing System.setProperty for webdriver.chrome.driver (assumes driver on PATH). No use of @Test annotations, no assertions to verify the drop succeeded. No explicit waits (WebDriverWait) for the iframe or the droppable element. No package‑level documentation or licensing header.
