            - paragraph [ref=f2e353]: All actions are hard‑coded in main. Adding another test case would require copying the whole class. No abstraction (Page Object Model) for the *Droppable* page – selectors are scattered in the test body. No configuration for URL, timeouts, or driver binaries – changes require code edits. Lack of a test framework (TestNG/JUnit) means the test cannot be run in parallel or be part of CI pipelines.
